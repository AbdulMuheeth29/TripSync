events {
    worker_connections 1024;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream tripsync_backend {
        server app:3000;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL certificates (update paths for your certificates)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Client body size (for file uploads)
        client_max_body_size 30M;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Static files (cache)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://tripsync_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API endpoints (no cache, rate limiting)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://tripsync_backend;
            proxy_read_timeout 60s;
        }

        # Auth endpoints (stricter rate limiting)
        location ~ ^/api/(login|register|password-reset) {
            limit_req zone=auth_limit burst=2 nodelay;
            proxy_pass http://tripsync_backend;
        }

        # Webhook endpoints (no rate limiting for Stripe)
        location /api/stripe/webhook {
            limit_req off;
            proxy_pass http://tripsync_backend;
            proxy_read_timeout 30s;
        }

        # Health check endpoint (no rate limiting)
        location /api/health {
            limit_req off;
            proxy_pass http://tripsync_backend;
            access_log off;
        }

        # All other requests
        location / {
            proxy_pass http://tripsync_backend;
        }
    }
}
