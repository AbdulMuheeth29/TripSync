      # ===== SSH Deployment Example =====
      # Uncomment for VPS/SSH-based deployments
      #
      # - name: Deploy to VPS via SSH
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
